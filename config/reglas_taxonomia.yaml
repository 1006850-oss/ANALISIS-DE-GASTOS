# Reglas de la taxonomía de compras (Hilo 2). Editable sin tocar el código.
# Versión: 2026-09-29
#
# Niveles:  categoría (15)  >  subcategoría  >  producto
# - Niveles 1 y 2 se asignan por ARTÍCULO ("articulo_normalizado").
# - Nivel 3 (producto) se asigna por palabras clave en descripción + concepto + nota.
#
# Cómo se aplica:
#   1. Si el artículo está en el maestro validado (Drive: maestro/maestro_categorias.xlsx), manda el maestro.
#   2. Si no, se recorren las reglas de "articulos" EN ORDEN y gana la primera que coincide.
#      Los patrones son expresiones regulares sobre el texto en MAYÚSCULAS y SIN TILDES.
#   3. Si ninguna coincide: categoría "Sin clasificar" (se lista para validar).
# "confianza": alta = coincidencia evidente; media = propuesta que conviene revisar.

version: "2026-09-30"

categorias:
  - "Infraestructura y obras"
  - "Mantenimiento"
  - "Equipamiento y mobiliario"
  - "Tecnología"
  - "Servicios generales de sede"
  - "Inmuebles"
  - "Marketing y admisión"
  - "Material educativo y programas académicos"
  - "Capacitación"
  - "Personal: bienestar y gestión humana"
  - "Viajes y movilidad"
  - "Servicios profesionales"
  - "Suministros e impresiones"
  - "Seguros"
  - "Cuentas contables (no gestionables por Compras)"

# Categorías que se excluyen de la matriz de Kraljic (siguen en el gasto total).
excluir_de_kraljic:
  - Cuentas contables (no gestionables por Compras)

# Construcción: la subcategoría es el tipo de intervención, tomado de "clase_glosa".
construccion:
  articulos: ["^CONSTRUCCION$"]
  subcategoria_por_clase:
    "OBRAS NUEVAS": "Obra nueva"
    "SEDES EN CONSTRUCCION": "Obra nueva"
    "AMPLIACIONES": "Ampliación"
    "MANTENIMIENTO PREVENTIVO": "Mejoras y mantenimiento mayor"
    "INVERSION": "Mejoras y mantenimiento mayor"
  subcategoria_sin_clase: "Obra sin tipo de intervención"

articulos:
  # ---------------- Cuentas contables (primero, para que no caigan en otra categoría)
  - {patron: "POR DEVENGAR|CONTRATADOS POR ANTICIPADO|ANICIPADOS|ANTICIPADOS DE SEGUROS|ANTICIPO A PROVEEDOR|DEPOSITOS EN GARANTIA|SERVICIOS PROVISIONADOS|COSTO AMORTIZADO", categoria: "Cuentas contables (no gestionables por Compras)", subcategoria: "Anticipos, diferidos y provisiones", confianza: alta}
  - {patron: "\\bEPS\\b", categoria: "Cuentas contables (no gestionables por Compras)", subcategoria: "Aportes EPS", confianza: alta}
  - {patron: "INTERESES|OTROS GASTOS FINANCIEROS", categoria: "Cuentas contables (no gestionables por Compras)", subcategoria: "Gastos financieros", confianza: alta}
  - {patron: "CONTRIBUCION SMV|DERECHO DE COTIZACION|ARBITRIOS|INDECOPI|MINTRA", categoria: "Cuentas contables (no gestionables por Compras)", subcategoria: "Tributos, tasas y contribuciones", confianza: alta}
  - {patron: "GASTOS REPARABLES|OTROS ACTIVOS INTANGIBLES|DONACION|RETRIBUCIONES AL DIRECTORIO|ADMISION : BONIFICACION", categoria: "Cuentas contables (no gestionables por Compras)", subcategoria: "Otros ajustes contables", confianza: media}

  # ---------------- Viajes y movilidad (antes que Marketing/Capacitación, que tienen viajes con prefijo)
  - {patron: "PASAJE", categoria: "Viajes y movilidad", subcategoria: "Pasajes", confianza: alta}
  - {patron: "VIATICO|ALOJAMIENTO|VIAJES|VISITA BID", categoria: "Viajes y movilidad", subcategoria: "Viáticos y alojamiento", confianza: alta}
  - {patron: "MOVILIDAD|COMBUSTIBLE|TRASLADO", categoria: "Viajes y movilidad", subcategoria: "Movilidad local y combustible", confianza: alta}

  # ---------------- Infraestructura y obras
  - {patron: "^CONSTRUCCION$", categoria: "Infraestructura y obras", subcategoria: "(según clase)", confianza: alta}
  # Decisión del usuario (2026-09-30): las "mejoras" son mantenimiento.
  - {patron: "MEJORAS INFRAESTRUCTURA|MEJORAS Y REPOSICION|^MEJORAS$|NECESIDADES Y MEJORAS|PLAN DE MEJORAS", categoria: "Mantenimiento", subcategoria: "Mejoras y reposiciones", confianza: alta}
  - {patron: "MATERIAL CONCRETO", categoria: "Infraestructura y obras", subcategoria: "Materiales de construcción", confianza: alta}
  - {patron: "INDECI|PLAN DE MANEJO AMBIENTAL", categoria: "Infraestructura y obras", subcategoria: "Licencias, permisos y estudios", confianza: media}

  # ---------------- Tecnología
  - {patron: "HABILITACION DE PLANTA EXTERNA|INTERNET|TELEFONIA|CELULAR|EQUIPO DE COMUNICACION", categoria: "Tecnología", subcategoria: "Telecomunicaciones", confianza: alta}
  - {patron: "LICENCIA|SOFTWARE|ALQUILER SIST", categoria: "Tecnología", subcategoria: "Software y licencias", confianza: alta}
  - {patron: "EQUIPOS DE COMPUTO|LAPTOP|ALQUILER PC", categoria: "Tecnología", subcategoria: "Equipos de cómputo", confianza: alta}
  - {patron: "SISTEMAS INFORMATICOS|PLATAFORMA|SOPORTE Y OBSERVACIONES|ASESORIA SISTEMAS|OFISIS|XTEND|MANT\\. Y REP\\. EQ INFORMATICOS|EVALUACION DESEMPENO 360", categoria: "Tecnología", subcategoria: "Desarrollo y soporte de sistemas", confianza: alta}

  # ---------------- Mantenimiento
  - {patron: "MANTENIMIENTO.*(?:INSTALACIONES|INMUEBLES|CORRECTIVO|VISUAL)|MANTENIMIENTO CORRECTIVO", categoria: "Mantenimiento", subcategoria: "Mantenimiento de instalaciones", confianza: alta}
  - {patron: "MANTENIMIENTO.*EQUIPOS", categoria: "Mantenimiento", subcategoria: "Mantenimiento de equipos y mobiliario", confianza: alta}

  # ---------------- Servicios generales de sede
  - {patron: "LIMPIEZA", categoria: "Servicios generales de sede", subcategoria: "Limpieza", confianza: alta}
  - {patron: "SEGURIDAD ELECTRONICA|MONITOREO DE INTRUSION|^SEGURIDAD|VIGILANCIA$|^VIGILANCIA", categoria: "Servicios generales de sede", subcategoria: "Seguridad y vigilancia", confianza: alta}
  - {patron: "SERVICIOS PUBLICOS|ENERGIA|AGUA", categoria: "Servicios generales de sede", subcategoria: "Servicios públicos y agua", confianza: alta}
  - {patron: "COURIER|TRANSPORTE DE CARGA|CUSTODIA DE DOCUMENTOS", categoria: "Servicios generales de sede", subcategoria: "Mensajería, transporte y archivo", confianza: alta}
  - {patron: "AMBULANCIA|CHARLAS DE SEGURIDAD|BOTIQUIN|CHEQUEO MEDICO", categoria: "Servicios generales de sede", subcategoria: "Salud y seguridad en el trabajo", confianza: alta}
  - {patron: "^ALIMENTACION|REFRIGERIOS|COFFEE BREAK", categoria: "Servicios generales de sede", subcategoria: "Alimentación y atenciones", confianza: alta}
  - {patron: "^EVENTOS|XXEVENTOS|GASTOS DE REPRESENTACION|COMUNICACION A PADRES", categoria: "Servicios generales de sede", subcategoria: "Eventos y representación", confianza: media}

  # ---------------- Inmuebles
  - {patron: "ALQUILER DE LOCALES|^ALQUILERES$|ALQUILER DE ESTACIONAMIENTOS", categoria: "Inmuebles", subcategoria: "Alquiler de inmuebles", confianza: alta}
  - {patron: "^TERRENOS$", categoria: "Inmuebles", subcategoria: "Compra de terrenos", confianza: alta}
  - {patron: "FIDEICOMISO|TASACIONES", categoria: "Inmuebles", subcategoria: "Fideicomiso y tasaciones", confianza: alta}

  # ---------------- Seguros
  - {patron: "SEGURO", categoria: "Seguros", subcategoria: "Seguros", confianza: alta}
  # Decisión del usuario (2026-09-30): "compras reales". En 2015–2017 son cuotas de pólizas (multirriesgo, RC).
  - {patron: "OTRAS CUENTAS POR PAGAR", categoria: "Seguros", subcategoria: "Seguros", confianza: media}

  # ---------------- Marketing y admisión
  - {patron: "CALL CENTER", categoria: "Marketing y admisión", subcategoria: "Call center", confianza: alta}
  - {patron: "PLAN DIGITAL|\\bSEM\\b", categoria: "Marketing y admisión", subcategoria: "Marketing digital", confianza: alta}
