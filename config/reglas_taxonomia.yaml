  - {patron: "PRUEBAS CENSALES|APLICADOR|CODIFICADORES|ANALISTA ESTADISTICO|RETROALIMENTACION AL MODELO|TUTORIA", categoria: "Material educativo y programas académicos", subcategoria: "Evaluación educativa", confianza: alta}
  - {patron: "CONTENIDOS|TEACHER RESOU|STUDENT WORKCANVAS|AFICHES Y GUIAS|SOLO LEARNING|LAUNCH|REDISENO IP|INICIATIVAS", categoria: "Material educativo y programas académicos", subcategoria: "Contenidos y plataformas educativas", confianza: media}
  - {patron: "MATERIAL PEDAGOGICO|MATERIAL EDUCATIVO|MATERIALES EDUCATIVOS|CIENCIAS|LABORATORIO|PROTOTYPING|MOCHILA|AFTERSCHOOL|CIRCUITO PSICOMOTRIZ", categoria: "Material educativo y programas académicos", subcategoria: "Material pedagógico y de laboratorio", confianza: alta}

  # ---------------- Equipamiento y mobiliario
  - {patron: "MUEBLES|SILLAS|AULAS", categoria: "Equipamiento y mobiliario", subcategoria: "Mobiliario", confianza: alta}
  - {patron: "SONIDO|MUSICA|EDUCACION FISICA|TOPICO|CAMARAS", categoria: "Equipamiento y mobiliario", subcategoria: "Equipamiento especializado", confianza: alta}
  - {patron: "VEHICULO", categoria: "Equipamiento y mobiliario", subcategoria: "Vehículos", confianza: alta}
  - {patron: "REPOSICIONES Y ENSERES|ACTIVOS MENORES|TACHOS|HERRAMIENTAS|ALQUILER EQUIPOS|ALQUILERES DE EQUIPOS", categoria: "Equipamiento y mobiliario", subcategoria: "Enseres y equipos menores", confianza: media}
  - {patron: "EQUIPAMIENTO|OTROS EQUIPOS", categoria: "Equipamiento y mobiliario", subcategoria: "Equipamiento general", confianza: alta}

  # ---------------- Personal: bienestar y gestión humana
  - {patron: "RECLUTAMIENTO|SELECCION|VERIFICACION DE ANTECEDENTES|REFERIDOS", categoria: "Personal: bienestar y gestión humana", subcategoria: "Reclutamiento y selección", confianza: alta}
