# Nivel 3 – producto. Se busca en "descripcion + concepto + nota" (MAYÚSCULAS, SIN TILDES).
# Por categoría, en orden; gana la primera. Si ninguna coincide: se usa el "concepto" (si existe),
# y si no, la subcategoría.
productos:
  Infraestructura y obras:
    # "Adicional" en descripción, concepto o nota, EXCEPTO "aula(s) adicional(es)", que es alcance
    # original y no un adicional de obra (ajuste aprobado en el Hilo 4).
    - {patron: "(?<!AULAS )(?<!AULA )ADICIONAL", producto: "Adicionales de obra"}
    - {patron: "SUPERVIS", producto: "Supervisión de obra"}
    - {patron: "PLOTEO|IMPRESION DE PLANOS", producto: "Impresiones y ploteos"}
