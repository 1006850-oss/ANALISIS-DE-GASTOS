  - {patron: "ACTIVACIONES|CHARLA MAGISTRAL|LOCAL CHARLAS|INCENTIVOS|OBSEQUIOS|MAMAS EMBAJADORAS|PROMOTORAS|AUSPICIO|MERCHANDISING", categoria: "Marketing y admisión", subcategoria: "Activaciones, eventos y merchandising", confianza: alta}
  - {patron: "MATERIALES ADQ\\. ALUMNOS|MATERIAL IMPRESO ADMISION|EXAMEN DE ADMISION|ADMISION|ADQUISICION DE ALUMNOS|PRE MATRICULA|MATERIALES BRANDING|MATERIALES LEALTAD|KIT DE RENOVACION", categoria: "Marketing y admisión", subcategoria: "Materiales de admisión y captación", confianza: alta}
  - {patron: "^VENTAS|^BRANDING|^LEALTAD|PUBLICIDAD", categoria: "Marketing y admisión", subcategoria: "Otros de marketing", confianza: media}

  # ---------------- Capacitación (antes que Material educativo por "CAPACITACION")
