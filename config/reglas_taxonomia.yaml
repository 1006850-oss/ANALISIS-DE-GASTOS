  # ---------------- Servicios profesionales
  - {patron: "ASESORIA LEGAL|NOTARIAL", categoria: "Servicios profesionales", subcategoria: "Legal y notarial", confianza: alta}
  - {patron: "CONTABLE|AUDITORIA|PRECIOS DE TRANSFERENCIA|INVENTARIO ACTIVO FIJO", categoria: "Servicios profesionales", subcategoria: "Contable, tributaria y auditoría", confianza: alta}
