  # ---------------- Suministros e impresiones
  - {patron: "IMPRESION|IMPRESO|IMPRENTA|FOTOCOPIA|DISENOS CAPACITACION", categoria: "Suministros e impresiones", subcategoria: "Impresiones y fotocopias", confianza: alta}
