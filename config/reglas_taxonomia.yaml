  - {patron: "ACREDITACION", categoria: "Servicios profesionales", subcategoria: "Acreditación", confianza: alta}
  - {patron: "ASESORIA|CONSULTORIA|HONORARIOS|ACUERDO DE SERVICIO|SUSCRIPCIONES", categoria: "Servicios profesionales", subcategoria: "Consultoría y asesoría", confianza: alta}
