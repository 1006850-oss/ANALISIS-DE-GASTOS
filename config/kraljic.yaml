# Parámetros de la matriz de Kraljic (Hilo 5). Aprobados por el usuario el 2026-09-30.
# Base: Kraljic, P. (1983). Purchasing Must Become Supply Management. Harvard Business Review, 61(5), 109–117.
version: "2026-09-30"

unidad:
  # Unidad de análisis: subcategorías gestionables; Infraestructura y obras se abre por tipo de trabajo (producto).
  categoria_por_producto: "Infraestructura y obras"
  prefijo: "Obras › "

impacto:
  # Alto impacto = unidades que, ordenadas por gasto, suman el 80 % (el que cruza el corte es alto).
  corte_pareto: 0.80

riesgo:
  peso_datos: 0.40
  peso_expertos: 0.60
  corte_alto: 3.0            # escala 1 (bajo) a 5 (alto)
  margen_sensibilidad: 0.25  # unidades a menos de 0.25 del corte se marcan "cerca del corte" (prioridad en el taller)
  datos:
    # Cada indicador vale 5 si se cumple y 1 si no; el puntaje de datos es el promedio.
    # HHI 1 800: umbral de "mercado altamente concentrado" de las Merger Guidelines 2023 (DOJ/FTC, EE. UU.).
    # Aquí mide la DEPENDENCIA del gasto propio en pocos proveedores, no la concentración de todo el mercado.
    hhi_alto: 1800
    max_proveedores: 3
    participacion_principal: 0.50
  criterios_expertos:
    alternativas: {nombre: "Proveedores alternativos en el mercado", peso: 0.30}
    criticidad: {nombre: "Criticidad para la operación del colegio", peso: 0.30}
    complejidad: {nombre: "Complejidad técnica o de especificación", peso: 0.20}
    reemplazo: {nombre: "Tiempo de reemplazo del proveedor", peso: 0.20}

# Propuesta inicial de puntajes (1 = riesgo bajo, 5 = alto) generada con IA para el taller de expertos.
# NO es validación: los expertos la confirman o corrigen en plantillas/kraljic_taller.xlsx.
propuesta_ia:
  "Obras › Obra civil": {alternativas: 2, criticidad: 4, complejidad: 4, reemplazo: 4, justificacion: "Hay varios contratistas, pero cambiar en plena obra retrasa la apertura de sedes; alta complejidad técnica y contractual."}
  "Obras › Adicionales de obra": {alternativas: 5, criticidad: 4, complejidad: 3, reemplazo: 5, justificacion: "Los ejecuta casi siempre el contratista de la obra en curso: proveedor cautivo, sin alternativa real."}
  "Obras › Acabados y carpintería": {alternativas: 2, criticidad: 2, complejidad: 2, reemplazo: 2, justificacion: "Mercado amplio de proveedores; especificación estándar."}
  "Obras › Instalaciones y especialidades": {alternativas: 2, criticidad: 3, complejidad: 3, reemplazo: 3, justificacion: "Varios proveedores; requiere especialistas certificados y coordinación con la obra."}
